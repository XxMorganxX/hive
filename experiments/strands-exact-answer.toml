# strands-exact-answer: the Strands seed improved by the Claude Code overseer on the exact_answer suite.
# Every tunable for this experiment lives here; relative paths resolve against this file.
#
# [experiment]  name of the run directory, the seed harness, and where run outputs go
# [model]       the frozen model under test and its reasoning effort, never part of a candidate (P3)
# [agent]       settings for the agent adapter the seed names (here Strands): its venv interpreter
#               (built by scripts/setup-framework-venvs.sh strands), pinned version, per-trial timeout,
#               and the price table, since Strands computes no cost (USD per million tokens for
#               gpt-5-nano, matching Pi's model catalog)
# [suite]       which evaluation suite to score on
# [evaluation]  trials per task (k) and how many trials run at once
# [loop]        generations to search, the promotion margin, and the hard dollar cap for the whole run (P12)
# [overseer]    the improvement strategy and its settings, including its own per-proposal dollar cap

[experiment]
name = "strands-exact-answer"
seed_candidate = "../harnesses/strands-baseline"
output_dir = "../experience"

[model]
provider = "openai"
id = "gpt-5-nano"
thinking = "low"

[agent]
python_path = "../.venvs/strands/bin/python"
strands_version = "1.61.1"
timeout_s = 180
prices = { input = 0.05, output = 0.40, cache_read = 0.005 }

[suite]
name = "exact_answer"

[evaluation]
trials_per_task = 2
concurrency = 4

[loop]
generations = 3
promotion_margin = 0.05
max_usd = 3.0

[overseer]
kind = "claude_code"
model = "sonnet"
max_usd_per_proposal = 1.0
timeout_s = 900
