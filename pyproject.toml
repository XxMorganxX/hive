[project]
name = "hive"
version = "0.1.0"
description = "Self-improving agent harnesses: agent, suite and overseer contracts plus an evaluation-gated improvement loop."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
hive = "hive.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hive"]

[tool.pytest.ini_options]
testpaths = ["tests"]
