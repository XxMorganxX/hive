id = "merge_intervals"
split = "search"
function = "merge_intervals"
description = """
`merge_intervals(intervals: list[list[int]]) -> list[list[int]]` merges overlapping closed intervals.

Each input interval is a two-element list `[start, end]` of integers with `start <= end`, and includes both \
endpoints. The input may be unsorted and may be empty. Two intervals overlap when they share at least one \
point, so `[1, 2]` and `[2, 3]` merge into `[1, 3]`, but `[1, 2]` and `[3, 4]` stay separate. Repeatedly merge \
overlapping intervals and return the result as a list of `[start, end]` lists sorted by `start`.
"""
